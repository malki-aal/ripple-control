# Ripple base theme (neutral, bold accents). The rest of the look is in ui/theme.py.
[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F1F3F6"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#111827"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
